<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- 只有 root 可以拥有该服务名 -->
  <policy user="root">
    <allow own="com.debmanager.Helper"/>
  </policy>

  <!-- 任意本地用户可以向助手发送调用；具体权限由 polkit 判定 -->
  <policy context="default">
    <allow send_destination="com.debmanager.Helper"
           send_interface="com.debmanager.Helper1"/>
  </policy>

</busconfig>
